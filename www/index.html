const REVAVG={5:1.0,6:1.13,7:1.36,8:1.4,9:1.79,10:2.03};   // average revival rounds per game, measured over simulated games
const estimate=(n,chat)=>{const rev=REVAVG[n]||1.5,rounds=(n-2)+rev,per=(chat||0)+40,tot=5+rounds*per+rev*34+20+(chat?49:5);return{min:Math.max(1,Math.round(tot/60)),per:Math.round(per)}};

const PL={
manip:[['I don’t make moves, I make math. The math says be careful.','Everyone’s playing checkers. Count the votes before you speak.','Funny how the loudest people never see it coming.','I’m only saying what you’re all thinking.'],['No hago jugadas, hago cuentas. Y las cuentas dicen que ojo.','Todos juegan a las damas. Contad los votos antes de hablar.','Qué gracioso: los más ruidosos nunca lo ven venir.','Solo digo lo que todos pensáis.'],['Je ne joue pas, je calcule. Et le calcul dit : prudence.','Tout le monde joue aux dames. Comptez les votes avant de parler.','Étonnant : les plus bruyants ne voient jamais rien venir.','Je dis juste ce que vous pensez tous.'],['Não faço jogadas, faço contas. E as contas dizem: cuidado.','Todo mundo joga damas. Contem os votos antes de falar.','Engraçado: os mais barulhentos nunca veem chegar.','Só digo o que vocês todos pensam.'],['Ich mache keine Züge, ich rechne. Und die Rechnung sagt: Vorsicht.','Alle spielen Dame. Zählt die Stimmen, bevor ihr redet.','Lustig: Die Lautesten sehen es nie kommen.','Ich sage nur, was ihr alle denkt.'],['我不走棋，我算账。账说：小心点。','大家都在玩跳棋，开口前先数数票。','好笑的是，最吵的人从来看不到危险。','我只是说出你们都在想的话。']],
loud:[['I came here to win, not make friends. Fight me.','Why does nobody want to challenge me?','Quiet people are boring. Say something real.','If I go home, I’m going home swinging.'],['Vine a ganar, no a hacer amigos. Atrévete.','¿Por qué nadie quiere retarme?','Los callados aburren. Di algo de verdad.','Si me voy a casa, me voy peleando.'],['Je suis là pour gagner, pas pour me faire des amis. Viens.','Pourquoi personne ne veut me défier ?','Les silencieux m’ennuient. Dites quelque chose de vrai.','Si je rentre chez moi, ce sera en me battant.'],['Vim para ganhar, não para fazer amigos. Vem.','Por que ninguém quer me desafiar?','Quem fica quieto é chato. Fale algo de verdade.','Se eu for embora, vou brigando.'],['Ich bin hier, um zu gewinnen, nicht um Freunde zu finden. Komm doch.','Warum will mich niemand herausfordern?','Stille Leute sind langweilig. Sag was Echtes.','Wenn ich gehe, dann kämpfend.'],['我来是为了赢，不是交朋友，来啊。','为什么没人敢挑战我？','沉默的人太无聊，说点真话。','要走我也要打到最后。']],
social:[['I talk to everyone, and trust me, people say things.','I know who’s mad at who. It’s a whole situation.','Can we all be honest for one second?','Not me hearing three different stories today.'],['Hablo con todos y, créeme, la gente suelta cosas.','Sé quién está enfadado con quién. Es todo un lío.','¿Podemos ser sinceros un segundo?','Hoy ya he oído tres versiones distintas.'],['Je parle à tout le monde, et crois-moi, ça jase.','Je sais qui est fâché contre qui. Tout un feuilleton.','On peut être honnêtes une seconde ?','Déjà trois versions différentes aujourd’hui.'],['Falo com todo mundo e, acredite, o povo solta coisas.','Sei quem está bravo com quem. É uma novela.','Podemos ser sinceros por um segundo?','Já ouvi três versões diferentes hoje.'],['Ich rede mit allen, und glaub mir, die Leute reden.','Ich weiß, wer auf wen sauer ist. Eine ganze Geschichte.','Können wir kurz ehrlich sein?','Heute schon drei verschiedene Versionen gehört.'],['我跟每个人都聊，相信我，大家什么都说。','谁跟谁有矛盾我都知道，乱得很。','我们能坦诚一秒钟吗？','今天已经听到三个不同的版本了。']],
quiet:[['I listen more than I talk. It tells me plenty.','Watch the people who agree too fast.','I’ll speak when it matters.','Patterns don’t lie. People do.'],['Escucho más de lo que hablo. Me dice mucho.','Fijaos en quienes aceptan demasiado rápido.','Hablaré cuando importe.','Los patrones no mienten. La gente sí.'],['J’écoute plus que je parle. Ça m’en apprend beaucoup.','Surveillez ceux qui sont d’accord trop vite.','Je parlerai quand ça comptera.','Les schémas ne mentent pas. Les gens, si.'],['Escuto mais do que falo. Isso diz muito.','Fiquem de olho em quem concorda rápido demais.','Falo quando importar.','Padrões não mentem. Pessoas sim.'],['Ich höre mehr zu, als ich rede. Das sagt viel.','Achtet auf die, die zu schnell zustimmen.','Ich rede, wenn es zählt.','Muster lügen nicht. Menschen schon.'],['我听得比说得多，听出不少东西。','留意那些太快附和的人。','该开口时我会开口。','规律不会说谎，人会。']],
emo:[['I really care about this group, so this hurts more than you think.','I can’t play without feeling it. That’s just me.','Please don’t pretend this isn’t personal.','I want to trust you all. Don’t make it hard.'],['Me importa este grupo, así que duele más de lo que creéis.','No sé jugar sin sentirlo. Soy así.','Por favor, no finjáis que esto no es personal.','Quiero confiar en todos. No me lo pongáis difícil.'],['Ce groupe compte pour moi, alors ça fait plus mal que vous ne croyez.','Je ne sais pas jouer sans ressentir. C’est moi.','Ne faites pas semblant que ce n’est pas personnel.','Je veux vous faire confiance. Ne me compliquez pas la tâche.'],['Me importo com esse grupo, então dói mais do que vocês pensam.','Não sei jogar sem sentir. Sou assim.','Por favor, não finjam que isso não é pessoal.','Quero confiar em todos. Não dificultem.'],['Diese Gruppe ist mir wichtig, deshalb tut es mehr weh, als ihr denkt.','Ich kann nicht spielen, ohne zu fühlen. So bin ich.','Tut bitte nicht so, als wäre das nicht persönlich.','Ich will euch vertrauen. Macht es mir nicht schwer.'],['我很在乎这个团队，所以比你们想的更痛。','我没法不带感情地玩，我就是这样。','别假装这件事不是针对个人。','我想相信你们，别让我为难。']],

function lockToast(){const e=q('shp');if(!e)return;e.innerHTML=`<div class="toast">🔒 ${t('lockedTab')}</div>`;clearTimeout(G.tt);G.tt=setTimeout(renderShow,1500)}

function renderShow(){const e=q('shp');if(!e||!G)return;if(LOCK.monitor||!G.showOpen||tabLocked(G.tab)){e.innerHTML='';return}const h=HP(),av=id=>id===null||id===undefined?'':(P(id).emo||'')+' ';let c='';
if(G.tab==='feed')c=G.feed.slice(0,40).map(f=>`<div class="fi${f.d?' dr':''}">${av(f.a)}${esc(t('f_'+f.k,pn(f.a),pn(f.b)))}<small> · ${t('round',f.r||1)}</small></div>`).join('')||`<p class="muted">${t('noItems')}</p>`;
else if(G.tab==='dms'){if(G.dmOpen!==null){const id=G.dmOpen,th2=G.dms[id]||[];c=`<button class="back" onclick="dmOpenT(null)">‹</button> <b>${P(id).emo} ${nmx(id)}</b><div class="log" style="height:130px">${th2.map(m=>`<div class="msg" style="text-align:${m.f==='h'?'right':'left'}">${esc(m.t)}</div>`).join('')}</div><div class="row"><input id="dmi" placeholder="${t('dmPh')}" maxlength="80" onkeydown="if(event.key==='Enter')dmSend(${id})"><button class="btn" onclick="dmSend(${id})">${t('send')}</button></div>`}
else c=G.P.filter(p=>!isH(p)&&p.alive).map(p=>{const th2=G.dms[p.id]||[],l=th2[th2.length-1];return`<div class="fi" style="cursor:pointer" onclick="dmOpenT(${p.id})">${p.emo} <b>${esc(p.name)}</b>${l?`<br><small>${esc(l.t).slice(0,50)}</small>`:''}</div>`}).join('')}
else if(G.tab==='rels')c=`<p class="muted">${t('theirView')}</p>`+G.P.filter(p=>!isH(p)&&p.alive).map(p=>{const r=REL(p.id,h.id);return`<div class="fi">${p.emo} <b>${esc(p.name)}</b><div class="r4"><span>${t('l_fr')}${bar(r.fr,'#3ddc97')}</span><span>${t('l_tr')}${bar(r.tr,'#5ab0ff')}</span><span>${t('l_ri')}${bar(r.ri,'#ff5a7a')}</span><span>${t('l_su')}${bar(r.su,'#ffb84d')}</span></div></div>`}).join('');
else if(G.tab==='votes'){const pv=pubVotes();c=G.P.map(p=>{const n=pv.filter(x=>x.c===p.id).reduce((s,x)=>s+(x.w||1),0),by=pv.filter(x=>x.v===p.id).slice(-4).map(x=>nmx(x.c)).join(', ');return`<div class="fi${p.alive?'':' off'}">${p.emo} <b>${esc(p.name)}</b> · ${n} ${t('recv')}${by?`<br><small>→ ${by}</small>`:''}</div>`}).join('')}
else if(G.tab==='alls'){const hid=h.id,show=x=>x.disc.has(hid)||x.found||x.bf,kn=G.al.filter(x=>!x.broken&&show(x)),bk=G.al.filter(x=>x.broken&&show(x)),kp=new Set(kn.map(x=>x.m.slice().sort((a,b)=>a-b).join('-'))),sp=suspPairs().filter(p=>!kp.has(p.join('-')));
const L=(arr,fn)=>arr.length?arr.map(fn).join(''):`<p class="muted">–</p>`;c=`<b>${t('knownA')}</b>`+L(kn,x=>`<div class="fi">🤝 ${x.m.map(nmx).join(' · ')}</div>`)+`<b>${t('suspA')}</b>`+L(sp,p=>`<div class="fi">❓ ${p.map(nmx).join(' · ')}</div>`)+`<b>${t('brokeA')}</b>`+L(bk,x=>`<div class="fi">💔 ${x.m.map(nmx).join(' · ')}</div>`)}
else{const pv=pubVotes(),mine=pv.filter(x=>x.c===h.id).reduce((s,x)=>s+(x.w||1),0);
c=`<div class="fi">${h.emo} <b>${esc(h.name)}</b><br><label style="margin:6px 0 2px">${t('titleLbl')}</label><input id="ttl" list="ttls" value="${esc(CFG.title||'')}" placeholder="${esc(t('a_under'))}" maxlength="24" onchange="setTitle(this.value)"><datalist id="ttls">${ARCH.map(a=>`<option value="${esc(t('a_'+a[0]))}">`).join('')}</datalist><small>${h.alive?'':'💀 '}${mine} ${t('recv')}</small></div>`+
G.P.filter(p=>!isH(p)).map(p=>{const n=pv.filter(x=>x.c===p.id).reduce((s,x)=>s+(x.w||1),0),cl=Object.entries(G.pubRel).filter(([k,v])=>v>0&&k.startsWith(p.id+'-')).map(([k])=>nmx(+k.split('-')[1])),fd=Object.entries(G.pubRel).filter(([k,v])=>v<0&&k.startsWith(p.id+'-')).map(([k])=>nmx(+k.split('-')[1]));
return`<div class="fi${p.alive?'':' off'}">${p.emo} <b>${esc(p.name)}</b> · ${esc(t('a_'+p.prof.ar))}<br><small>${p.bio.age} · ${p.surv||0} ${t('surv')} · ${n} ${t('recv')}${LOCK.location?' · 📍🔒':''}</small>${cl.length?`<br><small>${t('closeTo')}: ${cl.join(', ')}</small>`:''}${fd.length?`<br><small>${t('feuds')}: ${fd.join(', ')}</small>`:''}</div>`}).join('')}
e.innerHTML=PHX(`<div class="sheet"><div class="sh"><b>${t(G.tab)}</b><button class="x" onclick="showTab('${G.tab}')">✕</button></div><div class="shc">${c}</div></div>`)}
/* contestant goals */
const GOALS={manip:'final3',loud:'win',social:'protect',quiet:'lowprofile',emo:'protect',wild:'chaos',loyal:'protect',joker:'lowprofile',under:'prove'};
function pickGoal(b){const k=GOALS[b.prof.ar]||'win',g={k,t:null};if(k==='protect'){const f=G.P.filter(x=>x!==b).sort((p,q)=>REL(b.id,q.id).fr-REL(b.id,p.id).fr)[0];g.t=f?f.id:null}return g}
function goalText(b){const g=b.goal;if(!g)return'';const n=g.t!==null&&g.t!==undefined?pn(g.t):'';return({win:'wants to win the whole thing',final3:'wants to reach the final three by planning ahead',protect:'wants to protect '+(n||'their closest friend'),revenge:'wants revenge on '+n,lowprofile:'wants to stay under the radar and survive',prove:'wants to prove everyone who underestimated them wrong',chaos:'follows impulse and likes to surprise people'})[g.k]||''}
function competitor(s){const c=A().filter(p=>p!==s&&!ally(s.id,p.id));if(!c.length)return null;const sc=p=>REL(s.id,p.id).re*((p.prof?p.prof.t.comp:60)/100)+(p.hum?8:0);return c.sort((a,b)=>sc(b)-sc(a))[0]}
/* reactions to game events: only contestants with a reason to react, 1 to 3 short lines */
const exposure=b=>(G.acc[b.id]||0)*2+Object.values(b.mem.against).reduce((s,x)=>s+x,0)*.5+b.mood.l/30+(['anxious','fear','nervous'].includes(b.mood.m)?2:0);
const qrLine=(pool,n)=>{const a=QR[pool];return rnd(a[LI()]||a[0]).split('{n}').join(n||'')};
function reactions(type,d){const out=[],used=new Set(),bs=A().filter(p=>!isH(p)&&p!==d),R=Math.random;
const add=(s,pool,tg)=>{if(!s||used.has(s.id)||out.length>=3)return;const x=qrLine(pool,tg?tg.name:'');if(dupe(x))return;used.add(s.id);out.push({s,text:x});G.log.push({n:s.name,t:x});G.said.add(norm(x))};
if(type==='theme'){const c=[...bs].sort((a,b)=>exposure(b)-exposure(a));if(c.length){add(c[0],exposure(c[0])>3?'nervous':'theme');if(c.length>1&&R()<.6)add(c[1],'theme')}}
else if(type==='eliminated'){bs.forEach(b=>{const r=REL(b.id,d.id);if(r.fr>=55)add(b,'sad',d);else if(r.ri>=40||r.rs>=40)add(b,'cel',d)});if(out.length<2){const o=bs.filter(x=>!used.has(x.id));if(o.length)add(rnd(o),'shock',d)}}
else if(type==='revived'){bs.forEach(b=>{const r=REL(b.id,d.id);if(r.fr>=50)add(b,'glad',d);else if(r.ri>=40||r.rs>=40)add(b,'mad',d)});if(!out.length&&bs.length)add(rnd(bs),'shock',d)}
else if(type==='final'){const all=G.P.filter(p=>!isH(p));if(all.length)add(rnd(all),'final')}
return out}
const rxHTML=a=>a&&a.length?`<div class="rxs">${a.map(x=>`<div>${x.s.emo} <b>${esc(x.s.name)}</b> “${esc(x.text)}”</div>`).join('')}</div>`:'';
/* game event system: one entry point; it updates emotions and memory, then returns reactions to show */
function gameEvent(type,d){
if(type==='votes')afterVotes(d.votes,d.secret,d.mode,d.picks);
else if(type==='eliminated')afterElim(d);
else if(type==='round_start')roundTick();
else if(type==='nominated')d.forEach(n=>{if(!isH(n)&&n.alive)setEmo(n,'nervous',55,'nominated')});
else if(type==='revived'){G.P.forEach(b=>{if(isH(b)||!b.alive||b===d)return;const r=REL(b.id,d.id);if(r.fr>=50)setEmo(b,'happy',55,'friend is back',d.id);else if(r.ri>=40||r.rs>=40)setEmo(b,'frustrated',45,'rival is back',d.id)})}
return(type==='theme'||type==='eliminated'||type==='revived'||type==='final')?reactions(type,d):[]}
/* persistence: the cast and its memories survive between games */
const savedCast=()=>{try{return JSON.parse(localStorage.getItem('clicque_cast')||'null')}catch(e){return null}};
function castNames(){const sc=CFG.keepCast?savedCast():null,bots=sc&&sc.bots?sc.bots.filter(b=>b.n!==CFG.name):[];if(!bots.length)return{nm:genNames(10),em:shuffle(EMO)};
const nm=bots.map(b=>b.n),em=bots.map(b=>typeof b.e==='string'&&EMO.includes(b.e)?b.e:null),more=genNames(14).filter(n=>!nm.includes(n)),fe=EMO.filter(e=>!em.includes(e));for(let i=0;i<em.length;i++)if(em[i]===null)em[i]=fe.length?fe.shift():rnd(EMO);while(nm.length<10)nm.push(more.shift());while(em.length<10)em.push(fe.length?fe.shift():rnd(EMO));return{nm:nm.slice(0,10),em:em.slice(0,10)}}
function saveCast(){if(!CFG.keepCast||!G||!G.rel)return;try{const nm=id=>(G.P.find(p=>p.id==id)||{}).name,mk=o=>{const r={};Object.keys(o||{}).forEach(k=>{const n=nm(k);if(n)r[n]=o[k]});return r};
const bots=G.P.filter(p=>!isH(p)).map(b=>({n:b.name,e:b.emo,pr:b.prof,bio:{age:b.bio.age,job:b.bio.job,city:b.bio.city,quirk:b.bio.quirk},m:{ag:mk(b.mem.against),vf:mk(b.mem.votedFor),bb:mk(b.mem.betrayedBy),sv:mk(b.mem.saved)},rel:mk(G.rel[b.id])}));
localStorage.setItem('clicque_cast',JSON.stringify({h:(HP()||{}).name,bots}))}catch(e){}}
function restoreCast(){const sc=CFG.keepCast?savedCast():null;if(!sc||!sc.bots)return;const id=n=>{const p=G.P.find(x=>x.name===n);return p?p.id:null},back=(o,f)=>{const r={};Object.keys(o||{}).forEach(n=>{const i=id(n);if(i!==null)r[i]=f?f(o[n]):o[n]});return r};
G.P.forEach(b=>{if(isH(b))return;const s=sc.bots.find(x=>x.n===b.name);if(!s||!s.pr||!s.pr.t)return;b.prof=s.pr;b.pers=s.pr.pers;Object.assign(b.bio,{age:s.bio.age,job:s.bio.job,city:s.bio.city,quirk:s.bio.quirk});
b.mem.against=back(s.m.ag,v=>Math.floor(v*.7));b.mem.votedFor=back(s.m.vf,v=>Math.floor(v*.7));b.mem.betrayedBy=back(s.m.bb);b.mem.saved=back(s.m.sv,v=>Math.floor(v*.7));
Object.entries(s.rel||{}).forEach(([n,r])=>{const i=id(n);if(i===null||i===b.id)return;const cur=REL(b.id,i);cur.tr=Math.round(50+(r.tr-50)*.7);cur.aa=Math.round(40+((r.aa===undefined?40:r.aa)-40)*.7);cur.fr=Math.round(30+(r.fr-30)*.7);cur.re=Math.round(45+(r.re-45)*.7);cur.su=Math.round(15+(r.su-15)*.5);cur.ri=Math.round(r.ri*.8);cur.rs=Math.round(r.rs*.8)})})}
